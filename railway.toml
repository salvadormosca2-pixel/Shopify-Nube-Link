[build]
builder = "nixpacks"
buildCommand = "corepack enable && pnpm install && pnpm --filter @workspace/api-server run build"
# Rebuild on any change in the API source / shared packages / build config.
# Ojo: "artifacts/**" solo no alcanzó — Railway saltó el build ("no changes
# detected in watch paths") con cambios reales adentro. Por eso el "/**/*".
watchPatterns = [
  "artifacts/**",
  "artifacts/**/*",
  "lib/**",
  "lib/**/*",
  "package.json",
  "pnpm-lock.yaml",
  "railway.toml",
]

[build.environment]
NIXPACKS_NODE_VERSION = "20"

[deploy]
releaseCommand = "[ -n \"$DATABASE_URL\" ] && pnpm --filter @workspace/db run push-force || echo 'DATABASE_URL no configurada, saltando migraciones'"
startCommand = "pnpm --filter @workspace/api-server run start"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
