[build]
  base    = "artifacts/alfis-jeans"
  command = "pnpm run build"
  publish = "dist/public"

[build.environment]
  VITE_API_URL = "https://workspacealfis-jeans-production.up.railway.app"

# /admin sin barra final → con barra (para que matchee el proxy de abajo).
[[redirects]]
  from   = "/admin"
  to     = "/admin/"
  status = 301
  force  = true

# El panel admin se sirve bajo /admin (mismo dominio) proxeando al sitio del panel.
[[redirects]]
  from   = "/admin/*"
  to     = "https://aurora-admin-alfis.netlify.app/admin/:splat"
  status = 200
  force  = true

# El panel llama a /api en este mismo dominio; lo proxeamos al backend (Railway).
[[redirects]]
  from   = "/api/*"
  to     = "https://workspacealfis-jeans-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# SPA de la tienda: cualquier otra ruta cae en el index.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
