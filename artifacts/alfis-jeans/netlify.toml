[build]
  base    = "artifacts/alfis-jeans"
  command = "pnpm run build"
  publish = "dist/public"

[build.environment]
  VITE_API_URL = "https://workspacealfis-jeans-production.up.railway.app"

# Panel admin bajo /admin (mismo dominio) proxeando al sitio del panel.
# /admin SIN barra redirige a /admin/ (con barra): el panel usa base "/admin/"
# y su router sólo monta con la barra final; sin ella la página queda en blanco.
[[redirects]]
  from   = "/admin"
  to     = "/admin/"
  status = 301
  force  = true

# /admin/ y todo lo de adentro (incluidos los assets) van por proxy al panel.
[[redirects]]
  from   = "/admin/*"
  to     = "https://aurora-admin-alfis.netlify.app/admin/:splat"
  status = 200
  force  = true

# El panel llama a /api en este mismo dominio; lo proxeamos al backend (Railway).
[[redirects]]
  from   = "/api/*"
  to     = "https://workspacealfis-jeans-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# SPA de la tienda: cualquier otra ruta cae en el index.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
