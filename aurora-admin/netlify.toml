# Netlify config del panel admin. Se sirve bajo /admin (mismo dominio que la
# tienda pública, vía proxy desde el sitio de la tienda).
#
# Las redirecciones NO van acá: se publican en un archivo _redirects en la raíz
# del deploy (única fuente, evita conflictos). El deploy se hace por CLI:
#   pnpm run build
#   rm -rf deploy && mkdir -p deploy/admin && cp -r dist/* deploy/admin/
#   printf '.../_redirects...' > deploy/_redirects
#   netlify deploy --prod --dir deploy

[build]
  base    = "aurora-admin"
  command = "npm run build"
  publish = "dist"
