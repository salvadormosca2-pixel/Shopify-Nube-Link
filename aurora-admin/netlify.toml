# Netlify config for the standalone Aurora admin SPA.
# Netlify UI: Base directory = aurora-admin, Build command = npm run build,
# Publish directory = dist.
#
# El panel llama a /api en su propio dominio y Netlify lo proxea a Railway
# (evita CORS y no requiere VITE_API_URL). El orden importa: el proxy /api/*
# va ANTES del fallback SPA.

[build]
  base    = "aurora-admin"
  command = "npm run build"
  publish = "dist"

# Proxy de la API al backend real (Railway).
[[redirects]]
  from   = "/api/*"
  to     = "https://workspacealfis-jeans-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# SPA fallback: refrescar /productos u otro deep link no debe dar 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
